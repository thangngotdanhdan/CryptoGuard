name: Research experiment
description: Track one reproducible ML experiment
labels: [experiment]
body:
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis / question
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Models, features, splits, graph visibility, and seeds
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Metrics, acceptance criteria, and baselines
    validations:
      required: true
  - type: textarea
    id: observations
    attributes:
      label: Results / observed limitations (fill after running)
