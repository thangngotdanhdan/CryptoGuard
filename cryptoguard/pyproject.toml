[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptoguard"
version = "0.1.0"
description = "Reproducible graph ML research for illicit Bitcoin transaction screening"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "CryptoGuard contributors"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
ml = [
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "xgboost>=2.0",
  "torch-geometric>=2.5",
]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
